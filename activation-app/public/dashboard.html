<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard — Activation Intelligence</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0a0a08;
    --surface: #111110;
    --border: rgba(244,242,237,0.1);
    --border-strong: rgba(244,242,237,0.18);
    --text: #f4f2ed;
    --muted: #a8a39b;
    --dim: #6b6760;
    --signal: #4A8FE7;
    --mono: 'DM Mono', monospace;
    --serif: 'DM Serif Display', serif;
  }
  body { background: var(--bg); color: var(--text); font-family: var(--mono); min-height: 100vh; }
  nav {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 20px 40px;
    border-bottom: 1px solid var(--border);
  }
  .nav-brand { font-size: 13px; letter-spacing: 0.08em; }
  .nav-brand span { color: var(--signal); }
  .nav-right { display: flex; align-items: center; gap: 24px; font-size: 12px; color: var(--dim); }
  .nav-email { color: var(--muted); }
  .nav-logout { color: var(--dim); text-decoration: none; cursor: pointer; background: none; border: none; font-family: var(--mono); font-size: 12px; }
  .nav-logout:hover { color: var(--text); }
  main { max-width: 900px; margin: 0 auto; padding: 56px 40px; }
  .hero { margin-bottom: 56px; }
  .hero-label { font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--dim); margin-bottom: 20px; }
  h1 { font-family: var(--serif); font-size: 40px; font-weight: 400; line-height: 1.15; margin-bottom: 16px; }
  h1 em { color: var(--signal); font-style: italic; }
  .hero-sub { font-size: 14px; color: var(--muted); line-height: 1.7; max-width: 520px; }
  .cta-btn {
    display: inline-block;
    margin-top: 32px;
    background: var(--signal);
    color: #fff;
    font-family: var(--mono);
    font-size: 14px;
    font-weight: 500;
    padding: 16px 32px;
    text-decoration: none;
    transition: opacity 0.2s;
  }
  .cta-btn:hover { opacity: 0.88; }
  .section-label {
    font-size: 11px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--dim);
    margin-bottom: 24px;
    padding-bottom: 16px;
    border-bottom: 1px solid var(--border);
  }
  .empty {
    font-size: 13px;
    color: var(--dim);
    padding: 40px 0;
    line-height: 1.7;
  }
  .analysis-list { display: flex; flex-direction: column; gap: 2px; }
  .analysis-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 20px 24px;
    background: var(--surface);
    border: 1px solid var(--border);
    text-decoration: none;
    color: var(--text);
    transition: border-color 0.15s;
  }
  .analysis-row:hover { border-color: var(--border-strong); }
  .analysis-left { display: flex; flex-direction: column; gap: 6px; }
  .analysis-date { font-size: 11px; color: var(--dim); }
  .analysis-preview { font-size: 13px; color: var(--muted); }
  .status-badge {
    font-size: 10px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    padding: 4px 10px;
    border: 1px solid;
  }
  .status-done { color: #5cb85c; border-color: rgba(92,184,92,0.3); }
  .status-processing { color: var(--signal); border-color: rgba(74,143,231,0.3); }
  .status-error { color: #e05252; border-color: rgba(224,82,82,0.3); }
  footer { text-align: center; padding: 40px; font-size: 11px; color: var(--dim); border-top: 1px solid var(--border); margin-top: 80px; }
  @media (max-width: 600px) {
    nav { padding: 16px 20px; }
    main { padding: 40px 20px; }
    h1 { font-size: 28px; }
  }
</style>
</head>
<body>
<nav>
  <div class="nav-brand">Activation <span>Intelligence</span></div>
  <div class="nav-right">
    <span class="nav-email" id="navEmail"></span>
    <button class="nav-logout" onclick="logout()">Sign out</button>
  </div>
</nav>
<main>
  <div class="hero">
    <div class="hero-label">Dashboard</div>
    <h1>Your activation <em>workspace.</em></h1>
    <p class="hero-sub">Upload an onboarding sequence to get a full diagnostic — gaps, failure patterns, rebuilt emails, and a psychology map.</p>
    <a href="/upload" class="cta-btn">Upload your sequence →</a>
  </div>

  <div class="section-label">Previous analyses</div>
  <div id="analysisList"></div>
</main>
<footer>Activation Intelligence · Strategic Flow © 2026 · <a href="https://strategic-flow-pro.replit.app/terms.html" target="_blank" style="color:var(--dim);text-decoration:none;">Terms</a></footer>

<script>
async function init() {
  try {
    const res = await fetch('/auth/me');
    const data = await res.json();
    if (!data.signedIn) { window.location.href = '/login.html'; return; }
    document.getElementById('navEmail').textContent = data.email;
    loadAnalyses();
  } catch (e) { window.location.href = '/login.html'; }
}

async function loadAnalyses() {
  const list = document.getElementById('analysisList');
  try {
    const res = await fetch('/api/sequences');
    const data = await res.json();
    if (!data.sequences || data.sequences.length === 0) {
      list.innerHTML = '<div class="empty">No analyses yet. Upload your first sequence above.</div>';
      return;
    }
    list.innerHTML = '<div class="analysis-list">' + data.sequences.map(s => {
      const date = new Date(s.uploaded_at).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
      const statusClass = s.status === 'done' ? 'status-done' : s.status === 'error' ? 'status-error' : 'status-processing';
      const preview = s.raw_content ? s.raw_content.substring(0, 80).replace(/\n/g, ' ') + '…' : 'Sequence uploaded';
      return `<a href="/results/${s.id}" class="analysis-row">
        <div class="analysis-left">
          <div class="analysis-date">${date}</div>
          <div class="analysis-preview">${preview}</div>
        </div>
        <span class="status-badge ${statusClass}">${s.status}</span>
      </a>`;
    }).join('') + '</div>';
  } catch (e) {
    list.innerHTML = '<div class="empty">Could not load analyses.</div>';
  }
}

async function logout() {
  await fetch('/auth/logout', { method: 'POST' });
  window.location.href = '/login.html';
}

init();
</script>
</body>
</html>
