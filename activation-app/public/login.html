<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login — Activation Intelligence</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0a0a08;
    --surface: #111110;
    --border: rgba(244,242,237,0.1);
    --text: #f4f2ed;
    --muted: #a8a39b;
    --dim: #6b6760;
    --signal: #4A8FE7;
    --mono: 'DM Mono', monospace;
    --serif: 'DM Serif Display', serif;
  }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--mono);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .card {
    max-width: 440px;
    width: 100%;
    border: 1px solid var(--border);
    padding: 48px 40px;
    background: var(--surface);
  }
  .label {
    font-size: 11px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--dim);
    margin-bottom: 32px;
  }
  h1 {
    font-family: var(--serif);
    font-size: 32px;
    font-weight: 400;
    margin-bottom: 12px;
    line-height: 1.2;
  }
  h1 em { color: var(--signal); font-style: italic; }
  .sub {
    font-size: 13px;
    color: var(--muted);
    margin-bottom: 36px;
    line-height: 1.7;
  }
  label {
    display: block;
    font-size: 11px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--dim);
    margin-bottom: 8px;
  }
  input[type="email"] {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text);
    font-family: var(--mono);
    font-size: 14px;
    padding: 14px 16px;
    outline: none;
    margin-bottom: 20px;
    transition: border-color 0.2s;
  }
  input[type="email"]:focus { border-color: var(--signal); }
  button {
    width: 100%;
    background: var(--signal);
    color: #fff;
    border: none;
    font-family: var(--mono);
    font-size: 14px;
    font-weight: 500;
    padding: 16px;
    cursor: pointer;
    transition: opacity 0.2s;
  }
  button:hover { opacity: 0.88; }
  button:disabled { opacity: 0.4; cursor: not-allowed; }
  .msg {
    margin-top: 20px;
    font-size: 13px;
    line-height: 1.7;
    min-height: 20px;
  }
  .msg.ok { color: var(--signal); }
  .msg.err { color: #e05252; }
  .footer {
    margin-top: 40px;
    font-size: 11px;
    color: var(--dim);
    text-align: center;
  }
</style>
</head>
<body>
<div class="card">
  <div class="label">Activation Intelligence</div>
  <h1>Sign <em>in.</em></h1>
  <p class="sub">Enter your email — we'll send you a magic link. No password needed.</p>
  <label for="email">Email address</label>
  <input type="email" id="email" placeholder="you@company.com" autocomplete="email">
  <button id="btn" onclick="sendLink()">Send magic link →</button>
  <div class="msg" id="msg"></div>
  <div class="footer">strategic-flow-activation.replit.app</div>
</div>
<script>
async function sendLink() {
  const email = document.getElementById('email').value.trim();
  const btn = document.getElementById('btn');
  const msg = document.getElementById('msg');
  msg.className = 'msg';
  msg.textContent = '';
  if (!email || !email.includes('@')) {
    msg.className = 'msg err';
    msg.textContent = 'Please enter a valid email address.';
    return;
  }
  btn.disabled = true;
  btn.textContent = 'Sending…';
  try {
    const res = await fetch('/auth/magic', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email })
    });
    const data = await res.json();
    if (data.ok) {
      msg.className = 'msg ok';
      msg.textContent = 'Check your inbox — magic link sent. It expires in 15 minutes.';
      btn.textContent = 'Sent ✓';
    } else {
      msg.className = 'msg err';
      msg.textContent = data.error || 'Something went wrong. Try again.';
      btn.disabled = false;
      btn.textContent = 'Send magic link →';
    }
  } catch (e) {
    msg.className = 'msg err';
    msg.textContent = 'Network error. Please try again.';
    btn.disabled = false;
    btn.textContent = 'Send magic link →';
  }
}
document.getElementById('email').addEventListener('keydown', e => {
  if (e.key === 'Enter') sendLink();
});
</script>
</body>
</html>
