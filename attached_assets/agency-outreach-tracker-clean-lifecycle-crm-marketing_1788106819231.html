<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<title>Agency Outreach Tracker — Strategic Flow</title>
<style>

  }
  *{box-sizing:border-box}
  body{background:var(--bg);color:var(--ink);font-family:var(--sans);margin:0;padding:0 0 60px}
  header{padding:22px 16px 14px;border-bottom:1px solid var(--line-soft);position:sticky;top:0;background:rgba(11,13,16,0.96);backdrop-filter:blur(8px);z-index:10}
  h1{font-size:19px;margin:0 0 4px;font-weight:700}
  .subtitle{font-size:13px;color:var(--ink-dim);font-family:var(--mono)}
  .stats{display:flex;gap:10px;flex-wrap:wrap;padding:14px 16px;border-bottom:1px solid var(--line-soft)}
  .stat{background:var(--bg2);border:1px solid var(--line);border-radius:6px;padding:8px 12px;font-family:var(--mono);font-size:12px;color:var(--ink-dim)}
  .stat b{color:var(--ink);font-size:16px;display:block}
  .filters{display:flex;gap:8px;padding:10px 16px;flex-wrap:wrap;border-bottom:1px solid var(--line-soft)}
  .filter-btn{background:var(--bg2);border:1px solid var(--line);color:var(--ink-dim);font-family:var(--mono);font-size:12px;padding:6px 12px;border-radius:14px;cursor:pointer}
  .filter-btn.active{border-color:var(--accent);color:var(--accent)}
  .group{padding:16px}
  .group-title{font-family:var(--mono);font-size:12px;color:var(--amber);text-transform:uppercase;letter-spacing:.05em;margin:18px 0 10px;padding-bottom:6px;border-bottom:1px solid var(--line-soft)}
  .card{background:var(--bg2);border:1px solid var(--line);border-radius:8px;padding:14px;margin-bottom:10px;transition:opacity .15s}
  .card.done{opacity:0.45}
  .card-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
  .card-name{font-size:15px;font-weight:700}
  .card-meta{font-family:var(--mono);font-size:11px;color:var(--ink-dim);margin-top:2px}
  .prio-badge{font-family:var(--mono);font-size:10px;padding:2px 7px;border-radius:4px;font-weight:700}
  .prio-A{background:#1f3b36;color:var(--accent)}
  .prio-B{background:#332a1a;color:var(--amber)}
  .prio-C{background:#2a1a1a;color:#c17f7f}
  .contact-row{margin:10px 0;font-size:13px}
  .contact-link{color:var(--accent);text-decoration:none;word-break:break-all}
  .contact-badge{font-family:var(--mono);font-size:10px;color:var(--ink-dim);margin-right:6px}
  .opening{font-size:13px;color:var(--ink);margin:10px 0;line-height:1.5;font-style:italic;border-left:2px solid var(--line);padding-left:10px}

  summary{font-family:var(--mono);font-size:11px;color:var(--ink-dim);cursor:pointer}

  .msg-len{font-family:var(--mono);font-size:10px;color:var(--ink-dim);margin-top:4px}
  .copy-btn{font-family:var(--mono);font-size:11px;background:var(--line-soft);border:1px solid var(--line);color:var(--ink-dim);padding:4px 10px;border-radius:5px;cursor:pointer;margin-top:6px}
  .copy-btn:hover{border-color:var(--accent);color:var(--accent)}
  .check-row{display:flex;align-items:center;gap:8px;margin-top:12px;padding-top:10px;border-top:1px solid var(--line-soft)}
  .check-row input{width:18px;height:18px;accent-color:var(--accent)}
  .check-row label{font-family:var(--mono);font-size:12px;color:var(--ink-dim)}
  .followup-block{margin-top:10px;padding-top:10px;border-top:1px dashed var(--line-soft)}
  .followup-block.locked{opacity:0.4}
  .followup-label{font-family:var(--mono);font-size:11px;color:var(--amber);text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px}
  .lock-hint{font-family:var(--mono);font-size:11px;color:var(--ink-dim);font-style:italic}
  .sync-box{padding:12px 16px;border-bottom:1px solid var(--line-soft);display:flex;gap:8px;flex-wrap:wrap}
  .sync-btn{font-family:var(--mono);font-size:12px;background:var(--bg2);border:1px solid var(--line);color:var(--ink-dim);padding:7px 14px;border-radius:6px;cursor:pointer}
  .sync-btn:hover{border-color:var(--accent);color:var(--accent)}
  .sync-panel{display:none;padding:12px 16px;border-bottom:1px solid var(--line-soft);background:var(--bg2)}
  .sync-panel.open{display:block}
  .sync-panel textarea{width:100%;min-height:90px;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:6px;font-family:var(--mono);font-size:11px;padding:8px;box-sizing:border-box}
  .sync-hint{font-family:var(--mono);font-size:10.5px;color:var(--ink-dim);margin:6px 0}
  .sync-actions{display:flex;gap:8px;margin-top:6px}
</style>
</head>

function openExport(){

  const payload = {contacted: checked, followedUp: followupSent, exportedAt: new Date().toISOString()};

}

function copyExport(){
  const ta = document.getElementById('exportText');
  ta.select();
  navigator.clipboard.writeText(ta.value).catch(()=>{});
}

function openImport(){
  closeSyncPanels();
  document.getElementById('importPanel').classList.add('open');
}

function closeSyncPanels(){
  document.getElementById('exportPanel').classList.remove('open');
  document.getElementById('importPanel').classList.remove('open');
}

function doImport(){
  const raw = document.getElementById('importText').value.trim();
  if(!raw) return;
  try{
    const payload = JSON.parse(decodeURIComponent(escape(atob(raw))));
    checked = payload.contacted || {};
    followupSent = payload.followedUp || {};
    saveJSON(STORAGE_KEY, checked);
    saveJSON(FOLLOWUP_KEY, followupSent);
    closeSyncPanels();
    render();
    alert('Progress restored: ' + Object.values(checked).filter(Boolean).length + ' contacted, ' + Object.values(followupSent).filter(Boolean).length + ' followed up.');
  }catch(e){
    alert('Could not read that text. Make sure you pasted the full export text.');
  }
}

function toggleContacted(id){
  checked[id] = !checked[id];
  saveJSON(STORAGE_KEY, checked);
  // if un-contacted, also reset its follow-up state so it can't be marked sent before contact
  if(!checked[id] && followupSent[id]){
    followupSent[id] = false;
    saveJSON(FOLLOWUP_KEY, followupSent);
  }
  render();
}

function toggleFollowup(id){
  if(!checked[id]) return; // guard: cannot mark follow-up before contact
  followupSent[id] = !followupSent[id];
  saveJSON(FOLLOWUP_KEY, followupSent);
  render();
}

function copyMsg(id){
  const item = DATA.find(d=>d.id===id);
  navigator.clipboard.writeText(item.message).then(()=>{
    const btn = document.getElementById('copybtn-'+id);
    if(btn){ const orig = btn.textContent; btn.textContent = 'Copied ✓'; setTimeout(()=>btn.textContent = orig, 1500); }
  });
}

function copyFollowup(id){
  const item = DATA.find(d=>d.id===id);
  const msg = followupMessageFor(item);
  navigator.clipboard.writeText(msg).then(()=>{
    const btn = document.getElementById('copyfollowbtn-'+id);
    if(btn){ const orig = btn.textContent; btn.textContent = 'Copied ✓'; setTimeout(()=>btn.textContent = orig, 1500); }
  });
}

function renderStats(){
  const total = DATA.length;
  const done = DATA.filter(d=>checked[d.id]).length;
  const followedUp = DATA.filter(d=>followupSent[d.id]).length;
  const readyForFollowup = DATA.filter(d=>checked[d.id] && !followupSent[d.id]).length;
  const byPrio = {A:0,B:0,C:0};
  DATA.forEach(d=>{ if(!checked[d.id]) byPrio[d.priority]++; });
  document.getElementById('stats').innerHTML = `
    <div class="stat"><b>${total}</b>total</div>
    <div class="stat"><b>${done}</b>contacted</div>
    <div class="stat"><b>${total-done}</b>remaining</div>
    <div class="stat"><b>${readyForFollowup}</b>ready for follow-up</div>
    <div class="stat"><b>${followedUp}</b>followed up</div>
    <div class="stat"><b>${byPrio.A}</b>Priority A left</div>
    <div class="stat"><b>${byPrio.B}</b>Priority B left</div>
    <div class="stat"><b>${byPrio.C}</b>Priority C left</div>
  `;
}

function renderFilters(){
  const opts = [["ALL","All"],["A","Priority A"],["B","Priority B"],["C","Priority C"],["PENDING","Not contacted"],["FOLLOWUP","Ready for follow-up"],["TBD","Needs contact info"]];
  document.getElementById('filters').innerHTML = opts.map(([key,label])=>
    `<button class="filter-btn ${activeFilter===key?'active':''}" onclick="setFilter('${key}')">${label}</button>`
  ).join('');
}
function setFilter(key){ activeFilter = key; render(); }

function cardHtml(item){
  const isDone = !!checked[item.id];
  const isFollowedUp = !!followupSent[item.id];
  const contactHtml = item.contact_type === 'email'
    ? `<span class="contact-badge">EMAIL</span><a class="contact-link" href="mailto:${item.contact_value}">${item.contact_value}</a>`
    : item.contact_type === 'manual'
    ? `<span class="contact-badge" style="color:#c17f7f;border-color:#c17f7f">TBD</span><span style="color:#8a919c;font-style:italic">${item.contact_value}</span>`
    : `<span class="contact-badge">FORM</span><a class="contact-link" href="${item.contact_value}" target="_blank" rel="noopener">${item.contact_value}</a>`;

  const followupMsg = followupMessageFor(item);
  const followupBlockClasses = isDone ? "followup-block" : "followup-block locked";
  const followupBody = isDone
    ? `
      <div class="full-msg">${followupMsg}</div>
      <div class="msg-len">${followupMsg.length} / 500 characters</div>
      <button class="copy-btn" id="copyfollowbtn-${item.id}" onclick="copyFollowup('${item.id}')">Copy follow-up</button>
      <div class="check-row">
        <input type="checkbox" id="chkf-${item.id}" ${isFollowedUp?'checked':''} onchange="toggleFollowup('${item.id}')">
        <label for="chkf-${item.id}">Follow-up trimis</label>
      </div>
    `
    : `<div class="lock-hint">Se deblochează după ce bifezi "Am contactat".</div>`;

  return `
  <div class="card ${isDone?'done':''}">
    <div class="card-top">
      <div>
        <div class="card-name">${item.name}</div>
        <div class="card-meta">${item.country}</div>
      </div>
      <span class="prio-badge prio-${item.priority}">${item.priority}</span>
    </div>
    <div class="contact-row">${contactHtml}</div>
    <div class="opening">${item.opening}</div>
    <details>
      <summary>Full message</summary>
      <div class="full-msg">${item.message}</div>
      <div class="msg-len">${item.message.length} / 1000 characters</div>
      <button class="copy-btn" id="copybtn-${item.id}" onclick="copyMsg('${item.id}')">Copy message</button>
    </details>
    <div class="check-row">
      <input type="checkbox" id="chk-${item.id}" ${isDone?'checked':''} onchange="toggleContacted('${item.id}')">
      <label for="chk-${item.id}">Am contactat</label>
    </div>
    <div class="${followupBlockClasses}">
      <div class="followup-label">Follow-up</div>
      ${followupBody}
    </div>
  </div>`;
}

function render(){
  renderStats();
  renderFilters();
  let filtered = DATA;
  if(activeFilter === "PENDING") filtered = DATA.filter(d=>!checked[d.id]);
  else if(activeFilter === "FOLLOWUP") filtered = DATA.filter(d=>checked[d.id] && !followupSent[d.id]);
  else if(activeFilter === "TBD") filtered = DATA.filter(d=>d.contact_type==="manual");
  else if(["A","B","C"].includes(activeFilter)) filtered = DATA.filter(d=>d.priority===activeFilter);

  const groups = {A:[], B:[], C:[]};
  filtered.forEach(d=>groups[d.priority].push(d));

  let html = "";
  ["A","B","C"].forEach(p=>{
    if(groups[p].length===0) return;
    const label = p==="A" ? "Priority A — contact first" : p==="B" ? "Priority B — after signal from A" : "Priority C — larger orgs, harder access";
    html += `<div class="group"><div class="group-title">${label} (${groups[p].length})</div>`;
    groups[p].forEach(item=>{ html += cardHtml(item); });
    html += `</div>`;
  });
  document.getElementById('content').innerHTML = html;
}

render();
</script>
</body>
</html>
