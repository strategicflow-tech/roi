<style>
  :root{
    --bg:#F3F6F7;
    --paper:#FFFFFF;
    --ink:#15222B;
    --muted:#5C7078;
    --line:#DFE6E8;
    --teal:#1F7A6C;
    --teal-soft:#E4F1EE;
    --gold:#B9822E;
    --gold-soft:#F5EAD8;
    --danger:#B4472F;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Inter',sans-serif;}
  h1,h2,h3{font-family:'Fraunces',serif;font-weight:700;margin:0;}
  ::selection{background:var(--teal-soft);}

  /* ===== HEADER ===== */
  .head{
    position:sticky;top:0;z-index:20;
    background:var(--paper);
    border-bottom:1px solid var(--line);
    padding:16px 16px 12px;
  }
  .head-top{display:flex;align-items:center;gap:14px;}
  .ring-wrap{position:relative;width:56px;height:56px;flex:none;}
  .ring-wrap svg{width:56px;height:56px;transform:rotate(-90deg);}
  .ring-bg{fill:none;stroke:var(--line);stroke-width:5;}
  .ring-fg{fill:none;stroke:var(--teal);stroke-width:5;stroke-linecap:round;transition:stroke-dashoffset 400ms ease;}
  .ring-num{
    position:absolute;inset:0;display:grid;place-items:center;
    font-family:'JetBrains Mono',monospace;font-weight:700;font-size:0.72rem;color:var(--teal);
  }
  .head-title{flex:1;min-width:0;}
  .head-title h1{font-size:1.15rem;line-height:1.2;}
  .head-title p{margin:2px 0 0;font-size:0.82rem;color:var(--muted);}
  .head-title p b{color:var(--ink);font-family:'JetBrains Mono',monospace;}

  .search{
    margin-top:12px;position:relative;
  }
  .search input{
    width:100%;padding:10px 14px 10px 36px;border-radius:11px;
    border:1px solid var(--line);background:var(--bg);
    font-family:'Inter',sans-serif;font-size:0.95rem;color:var(--ink);
  }
  .search input:focus{outline:2px solid var(--teal);outline-offset:1px;}
  .search::before{
    content:"⌕";position:absolute;left:12px;top:50%;transform:translateY(-50%);
    color:var(--muted);font-size:1.1rem;pointer-events:none;
  }

  .chips{display:flex;gap:7px;margin-top:11px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none;}
  .chips::-webkit-scrollbar{display:none;}
  .chip{
    flex:none;font-family:'Inter',sans-serif;font-weight:600;font-size:0.8rem;
    padding:7px 13px;border-radius:999px;border:1px solid var(--line);
    background:var(--paper);color:var(--muted);white-space:nowrap;cursor:pointer;
  }
  .chip.on{background:var(--ink);border-color:var(--ink);color:#fff;}

  /* ===== LIST ===== */
  .list{padding:14px 12px 90px;max-width:640px;margin:0 auto;}
  .empty{text-align:center;color:var(--muted);padding:60px 20px;font-size:0.95rem;}

  .card{
    background:var(--paper);border:1px solid var(--line);border-radius:16px;
    padding:14px 15px;margin-bottom:10px;transition:opacity 200ms ease;
  }
  .card.done{opacity:0.46;}
  .card-top{display:flex;align-items:flex-start;gap:10px;}
  .card-info{flex:1;min-width:0;}
  .card-name{font-family:'Fraunces',serif;font-weight:700;font-size:1.02rem;line-height:1.25;}
  .card-name a{color:inherit;text-decoration:none;border-bottom:1px solid var(--line);}
  .meta-row{display:flex;align-items:center;gap:6px;margin-top:4px;flex-wrap:wrap;}
  .badge{
    font-family:'JetBrains Mono',monospace;font-size:0.68rem;font-weight:700;
    padding:2px 8px;border-radius:6px;letter-spacing:0.02em;
  }
  .badge.cat{background:var(--bg);color:var(--muted);}
  .badge.both{background:var(--gold-soft);color:var(--gold);}

  .check{
    flex:none;width:26px;height:26px;border-radius:8px;
    border:2px solid var(--line);background:var(--paper);
    display:grid;place-items:center;cursor:pointer;color:transparent;
    font-size:0.95rem;font-weight:700;
  }
  .check.on{background:var(--teal);border-color:var(--teal);color:#fff;}

  .actions{margin-top:11px;display:grid;gap:7px;}
  .arow{display:flex;gap:7px;}
  .abtn{
    flex:1;display:flex;align-items:center;justify-content:center;gap:6px;
    font-family:'Inter',sans-serif;font-weight:600;font-size:0.84rem;
    padding:9px 10px;border-radius:10px;border:1px solid var(--line);
    background:var(--bg);color:var(--ink);text-decoration:none;cursor:pointer;
  }
  .abtn.primary{background:var(--teal-soft);border-color:var(--teal);color:var(--teal);}
  .abtn.copy{flex:0 0 auto;padding:9px 12px;}
  .abtn.copy.copied{background:var(--teal);color:#fff;border-color:var(--teal);}
  .abtn svg{width:15px;height:15px;flex:none;}


  .badge.big{background:#F6E7E2;color:var(--danger);}
  .card.nocontact{opacity:0.55;}
  .nocontact-note{
    margin-top:10px;font-size:0.82rem;color:var(--muted);
    font-style:italic;
  }
  .contact-line{font-family:'JetBrains Mono',monospace;font-size:0.72rem;color:var(--muted);margin-top:6px;word-break:break-all;}

  @media (prefers-reduced-motion: reduce){
    .card{transition:none;} .ring-fg{transition:none;}
  }
</style>
</head>

        contacted = new Set(JSON.parse(raw));
      }
    }catch(e){ /* localStorage indisponibil (ex: fisier deschis din mail/file:// restrictiv): pornim de la zero */ }

    try{
      const already = localStorage.getItem(MIGRATION_KEY);
      if(!already){
        ALREADY_CONTACTED_IDS.forEach(id => contacted.add(id));

    ta.value = text; ta.style.position='fixed'; ta.style.opacity='0';
    document.body.appendChild(ta); ta.select();
    try{ document.execCommand('copy'); done(); }catch(e){}
    document.body.removeChild(ta);
  }

  function matches(item){
    if(query){
      const hay = (item.name + ' ' + item.cat).toLowerCase();
      if(!hay.includes(query.toLowerCase())) return false;
    }
    const has_e = !!item.email, has_l = !!item.li;
    const isDone = contacted.has(item.id);
    switch(filter){
      case 'todo': return !isDone;
      case 'done': return isDone;
      case 'both': return has_e && has_l;
      case 'email': return has_e && !has_l;
      case 'li': return has_l && !has_e;
      case 'skipbig': return !item.big;
      default: return true;
    }
  }

  function cardHTML(item){
    const has_e = !!item.email, has_l = !!item.li;
    const isDone = contacted.has(item.id);
    const noContact = !has_e && !has_l;
    const eSubj = emailSubject(item.id, item.name);
    const eBody = emailBody(item.id, item.name, item.page);
    const liMsg = liMessage(item.id, item.name, item.page);
    const mailto = has_e ? ('mailto:' + encodeURIComponent(item.email) + '?subject=' + encodeURIComponent(eSubj) + '&body=' + encodeURIComponent(eBody)) : '';

    let actions = '';
    if(has_e){
      actions += '<div class="arow">' +
        '<a class="abtn primary" href="'+esc(mailto)+'" target="_blank" rel="noopener">✉ Deschide email</a>' +
        '<button class="abtn copy" data-copy="email" data-id="'+esc(item.id)+'">Copiază</button>' +
        '</div>' +
        '<div class="contact-line">'+esc(item.email)+'</div>';
    }
    if(has_l){
      actions += '<div class="arow">' +
        '<a class="abtn" href="'+esc(item.li)+'" target="_blank" rel="noopener">in Deschide profil</a>' +
        '<button class="abtn copy" data-copy="li" data-id="'+esc(item.id)+'">Copiază DM</button>' +
        '</div>';
    }
    if(noContact){
      actions += '<div class="nocontact-note">Fără email sau LinkedIn valid găsit. Verifică manual website-ul.</div>';
    }

    let badges = '';
    if(item.big) badges += '<span class="badge big">companie mare</span>';
    if(has_e && has_l) badges += '<span class="badge both">email + linkedin</span>';
    badges += '<span class="badge cat">'+esc(item.cat)+'</span>';

    return '<div class="card'+(isDone?' done':'')+(noContact?' nocontact':'')+'" data-id="'+esc(item.id)+'">' +
      '<div class="card-top">' +
        '<div class="card-info">' +
          '<div class="card-name"><a href="'+esc(item.page)+'" target="_blank" rel="noopener">'+esc(item.name)+'</a></div>' +
          '<div class="meta-row">'+badges+'</div>' +
        '</div>' +
        '<button class="check'+(isDone?' on':'')+'" data-toggle="'+esc(item.id)+'">✓</button>' +
      '</div>' +
      '<div class="actions">'+actions+'</div>' +
    '</div>';
  }

  function render(){
    const filtered = DATA.filter(matches);
    if(filtered.length === 0){
      list.innerHTML = '<div class="empty">Nimic nu se potrivește. Încearcă alt filtru sau altă căutare.</div>';
    } else {
      list.innerHTML = filtered.map(cardHTML).join('');
    }
    doneCountEl.textContent = contacted.size;
    const pct = DATA.length ? contacted.size / DATA.length : 0;
    const offset = RING_LEN - pct * RING_LEN;
    ring.style.strokeDashoffset = offset;
    ringNum.textContent = Math.round(pct*100) + '%';
  }

  list.addEventListener('click', (e)=>{
    const toggleId = e.target.closest('[data-toggle]');
    if(toggleId){
      const id = toggleId.getAttribute('data-toggle');
      if(contacted.has(id)) contacted.delete(id); else contacted.add(id);
      saveContacted();
      render();
      return;
    }
    const copyBtn = e.target.closest('[data-copy]');
    if(copyBtn){
      const id = copyBtn.getAttribute('data-id');
      const item = DATA.find(d => d.id === id);
      if(!item) return;
      const kind = copyBtn.getAttribute('data-copy');
      const text = kind === 'email' ? emailBody(item.id, item.name, item.page) : liMessage(item.id, item.name, item.page);
      copyText(text, copyBtn);
    }
  });

  chips.addEventListener('click', (e)=>{
    const btn = e.target.closest('.chip');
    if(!btn) return;
    filter = btn.getAttribute('data-f');
    Array.from(chips.children).forEach(c=>c.classList.toggle('on', c===btn));
    render();
  });

  let qTimer;
  qInput.addEventListener('input', ()=>{
    clearTimeout(qTimer);
    qTimer = setTimeout(()=>{ query = qInput.value; render(); }, 120);
  });

  loadContacted();
})();
</script>
</body>
</html>
